<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japan Trip">
  <title>Japan Trip</title>
  <meta name="description" content="Japan Sep 22 to Oct 5 live trip tool">
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <link rel="preconnect" href="https://en.wikipedia.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=81">
</head>
<body>
  <header class="topbar">
    <div class="topline">
      <button class="back" id="backBtn" aria-label="Back">‹</button>
      <button class="brand" id="brandBtn"><strong>JAPAN</strong><span>SEP 22 – OCT 5</span></button>
      <button class="search" id="searchBtn" aria-label="Search">⌕</button>
    </div>
    <div class="dayrail" id="dayRail"></div>
  </header>

  <main>
    <section class="view active" id="todayView"></section>
    <section class="view" id="mapView"></section>
    <section class="view" id="tripView"></section>
    <section class="view" id="moreView"></section>
    <section class="view" id="liveView"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="today"><span>◉</span><b>Today</b></button>
    <button class="tab" data-view="map"><span>⌖</span><b>Map</b></button>
    <button class="tab" data-view="trip"><span>▦</span><b>Trip</b></button>
    <button class="tab" data-view="more"><span>•••</span><b>More</b></button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="sheetGrab"></div>
    <div class="sheetTop"><button id="sheetBack">‹ Back</button><button id="sheetClose">Done</button></div>
    <div id="sheetBody"></div>
  </aside>

  <div class="searchLayer" id="searchLayer">
    <div class="searchTop"><input id="searchInput" type="search" placeholder="Search the trip" autocomplete="off"><button id="searchClose">Done</button></div>
    <div id="searchResults" class="searchResults"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../v2/data.js?v=81"></script>
  <script src="current.js?v=81"></script>
  <script src="../final/enrich.js?v=81"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app2.js?v=81"></script>
</body>
</html>
