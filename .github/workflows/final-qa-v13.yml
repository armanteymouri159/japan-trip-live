name: final v13 QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax
        run: |
          node --check audit-v12.js
          node --check site-v12.js
          node --check photo-safety-v13.js
          grep -q 'photo-safety-v13.js?v=13' index.html
          grep -q 'photo-safety-v13.css?v=13' index.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start static site
        run: |
          python3 -m http.server 8000 >/tmp/japan-v13.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:8000/index.html >/dev/null
      - name: Mobile app and photo safety audit
        run: |
          cat > final-smoke.cjs <<'EOF'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[],badLocal=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.url().includes('127.0.0.1:8000')&&r.status()>=400)badLocal.push(`${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:8000/?v=13',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('.daybtn');
            const days=await page.locator('.daybtn').count(); if(days!==14)throw new Error(`days=${days}`);
            if(await page.locator('.navbtn').count()!==4)throw new Error('bottom nav count');
            let googleCount=0;
            for(let i=0;i<14;i++){
              await page.locator('.daybtn').nth(i).click();
              await page.waitForTimeout(150);
              const stops=await page.locator('#timeline .stop').count(); if(!stops)throw new Error(`day ${i+1} no stops`);
              const title=(await page.locator('#dayTitle').innerText()).trim(); if(!title)throw new Error(`day ${i+1} no title`);
              await page.locator('.navbtn[data-panel="areas"]').click(); await page.waitForTimeout(80);
              const areaCount=await page.locator('#areas .area').count(); if(i!==13&&areaCount<1)throw new Error(`day ${i+1} no areas`);
              googleCount+=await page.locator('a[href*="google.com/maps"]').count();
              await page.locator('.navbtn[data-panel="map"]').click(); await page.waitForTimeout(150); if(!await page.locator('#map').isVisible())throw new Error(`day ${i+1} map hidden`);
              await page.locator('.navbtn[data-panel="today"]').click();
            }
            await page.locator('.daybtn').nth(2).click(); await page.locator('.navbtn[data-panel="areas"]').click();
            const k=await page.locator('#areas').innerText(); if(!/Aso Panorama Line/i.test(k)||!/CURRENTLY CLOSED/i.test(k)||!/08:30/i.test(k))throw new Error('Kyushu audited content missing');
            await page.locator('.daybtn').nth(5).click(); await page.locator('.navbtn[data-panel="areas"]').click();
            const ky=await page.locator('#areas').innerText(); if(!/Namba Yasaka/i.test(ky)||!/Nonomiya/i.test(ky)||!/CHOOSE ONE/i.test(ky)||!/INTENTIONALLY CUT/i.test(ky))throw new Error('Osaka/Kyoto audited content missing');
            const hrefs=await page.locator('a[href*="google.com/maps"]').evaluateAll(as=>as.map(a=>a.href));
            for(const h of hrefs){if(!/^https:\/\/www\.google\.com\/maps\/(dir|search)\/\?api=1/.test(h)||/undefined|null/.test(h))throw new Error('bad map url '+h)}
            await page.locator('.navbtn[data-panel="today"]').click(); await page.waitForTimeout(1800);
            const imgs=await page.locator('#timeline .imgbox').evaluateAll(es=>es.map(e=>({label:e.dataset.label,badge:e.dataset.badge||'',bg:e.style.backgroundImage,none:e.classList.contains('no-photo')})));
            const urlToLabel=new Map();
            for(const x of imgs){if(!x.bg||x.none)continue;const prev=urlToLabel.get(x.bg);if(prev&&prev!==x.label)throw new Error(`duplicate photo ${prev} / ${x.label}`);urlToLabel.set(x.bg,x.label)}
            await page.locator('#searchBtn').click();await page.locator('#searchInput').fill('Aso Panorama');await page.waitForTimeout(100);if(await page.locator('#searchResults .searchresult').count()<1)throw new Error('search failed');await page.locator('#closeSearch').click();
            if(errors.length)throw new Error('page errors '+errors.join('|'));if(badLocal.length)throw new Error('bad local '+badLocal.join('|'));
            console.log(JSON.stringify({days,googleLinksRendered:googleCount,visibleMapLinksChecked:hrefs.length,timelineImagesChecked:imgs.length,pageErrors:errors,badLocal},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node final-smoke.cjs
