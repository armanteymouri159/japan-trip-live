name: v12 browser smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 8000 >/tmp/japan-site.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:8000/index.html >/dev/null
      - name: Mobile interaction audit
        run: |
          cat > smoke.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const pageErrors=[]; const badLocal=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{const u=r.url(); if(u.includes('127.0.0.1:8000')&&r.status()>=400) badLocal.push(`${r.status()} ${u}`)});
            await page.goto('http://127.0.0.1:8000/?v=12',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('.daybtn');
            const days=await page.locator('.daybtn').count();
            if(days!==14) throw new Error(`Expected 14 day buttons, got ${days}`);
            const navs=await page.locator('.navbtn').count();
            if(navs!==4) throw new Error(`Expected 4 nav buttons, got ${navs}`);
            for(let i=0;i<days;i++){
              await page.locator('.daybtn').nth(i).click();
              await page.waitForTimeout(80);
              const title=(await page.locator('#dayTitle').textContent()||'').trim();
              const stops=await page.locator('#timeline .stop').count();
              const areas=await page.locator('#areaStrip .areamini').count();
              if(!title) throw new Error(`Day ${i+1}: blank title`);
              if(stops<1) throw new Error(`Day ${i+1} ${title}: no timeline stops`);
              if(areas<1 && i!==13) throw new Error(`Day ${i+1} ${title}: no area cards`);
              await page.locator('.navbtn[data-panel="areas"]').click();
              await page.waitForTimeout(60);
              if(areas>0 && await page.locator('#areas .area').count()<1) throw new Error(`Day ${i+1} ${title}: Areas panel failed`);
              await page.locator('.navbtn[data-panel="map"]').click();
              await page.waitForTimeout(180);
              if(!await page.locator('#map').isVisible()) throw new Error(`Day ${i+1} ${title}: Map panel hidden`);
              await page.locator('.navbtn[data-panel="today"]').click();
            }
            await page.locator('.daybtn').nth(2).click();
            await page.locator('.navbtn[data-panel="areas"]').click();
            const sep24=await page.locator('#areas').innerText();
            if(!/Aso Panorama Line/i.test(sep24)) throw new Error('Sep24 missing Aso Panorama Line');
            if(!/Kokonoe/i.test(sep24)) throw new Error('Sep24 missing Kokonoe decision');
            if(!/CURRENTLY CLOSED/i.test(sep24)) throw new Error('Sep24 missing current crater restriction');
            await page.locator('.daybtn').nth(5).click();
            await page.locator('.navbtn[data-panel="areas"]').click();
            const sep27=await page.locator('#areas').innerText();
            if(!/Namba Yasaka/i.test(sep27)||!/Arashiyama/i.test(sep27)||!/Nonomiya/i.test(sep27)) throw new Error('Sep27 missing audited Osaka/Kyoto content');
            if(!/INTENTIONALLY CUT/i.test(sep27)) throw new Error('Sep27 missing explicit cut decisions');
            const hrefs=await page.locator('a[href*="google.com/maps"]').evaluateAll(as=>as.map(a=>a.href));
            for(const h of hrefs){
              if(!/^https:\/\/www\.google\.com\/maps\/(dir|search)\/\?api=1/.test(h)) throw new Error('Bad Google Maps URL: '+h);
              if(/undefined|null/.test(h)) throw new Error('Malformed Google Maps URL: '+h);
            }
            await page.locator('#searchBtn').click();
            await page.locator('#searchInput').fill('Nonomiya');
            await page.waitForTimeout(100);
            if(await page.locator('#searchResults .searchresult').count()<1) throw new Error('Search did not find Nonomiya');
            await page.locator('#closeSearch').click();
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            if(badLocal.length) throw new Error('Broken local assets: '+badLocal.join(' | '));
            console.log(JSON.stringify({days,navs,googleLinksChecked:hrefs.length,pageErrors,badLocal},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node smoke.cjs
